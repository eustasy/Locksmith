# eustasy/.Normal 4.0beta9
name: Normal (Env)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".env*"]
  pull_request:
    branches: [main]
    paths: [".env*"]

permissions:
  contents: read

jobs:
  env:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: qltysh/qlty-action/install@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0

      - name: Lint (dotenv-linter)
        run: qlty check --all --filter=dotenv-linter
