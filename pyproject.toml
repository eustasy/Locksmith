[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "locksmith"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "rsa>=4.9.1",
    # 0.137.0 made include_router() lazy (_IncludedRouter placeholders in app.routes).
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "aiosqlite>=0.22.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "email-validator>=2.3.0",
    "click>=8.5.0",
    "slowapi>=0.1.10",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
]

[project.scripts]
locksmith-setup   = "locksmith.cli.setup:main"
locksmith-issue   = "locksmith.cli.generate:main"
locksmith-verify  = "locksmith.cli.verify:main"
locksmith-request = "locksmith.cli.request:main"
locksmith-serve   = "locksmith.api.app:serve"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["locksmith"]
omit = ["tests/*"]
